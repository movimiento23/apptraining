
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Día de descanso – Arnol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: url('../../../img/descanso.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f2f2f2;
      text-align: center;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 2rem;
      border-radius: 12px;
      width: 95%;
      max-width: 400px; /* Perfecto para móviles */
      text-align: center;
      color: #ffffff;
      font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      animation: aparecer 0.6s ease-out forwards;
    }

    h1 {
      color: #ff7961;
      margin-bottom: 1rem;
      font-size: 1.5rem;
      line-height: 1.3;
    }

    .descanso-mensaje {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      font-size: 1rem;
      line-height: 1.5;
      color: #f2f2f2;
    }

    .descanso-mensaje br {
      display: block;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-flotante {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 60px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* Responsive para pantallas medianas */
    @media (max-width: 480px) {
      .contenedor {
        padding: 1.5rem;
        font-size: 1rem;
      }
      h1 {
        font-size: 1.3rem;
      }
      .descanso-mensaje {
        font-size: 0.95rem;
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <img src="../../img/logo-movimiento.png" alt="Logo Movimiento Training" style="width: 100px; max-width: 80%; margin-bottom: 1rem;" />
    <h1>¡Hoy Es Tu Día De Descanso, Arnol!</h1>
    <p class="descanso-mensaje">
      🧘‍♂️ Tu cuerpo hoy se recupera, pero tu compromiso sigue firme.<br>
      Movete, hacé pausas activas, estirate, hidratate, y recordá que descansar también es avanzar.<br><br>
      ¡Nos vemos en el Próximo Entrenamiento con toda la energía!
    </p>
  </div>
</body>
</html>
