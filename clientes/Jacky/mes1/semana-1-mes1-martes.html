
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Día de descanso – Jacky</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: url('../../../img/descanso.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f2f2f2;
      text-align: center;
      padding: 2rem;
    }
      body {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  height: 100vh;
}
      .contenedor {
  background-color: rgba(0, 0, 0, 0.75);
  padding: 2rem;
  border-radius: 12px;
  max-width: 600px;
  width: 100%;
  text-align: center;
  color: #ffffff;
  font-size: 1.2rem;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}
  .contenedor {
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

  h1 {
  color: #ff7961; /* tono más cálido y visible */
  margin-bottom: 1rem;
  font-size: 1.8rem;
}

    .descanso-mensaje {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(6px);
  border-radius: 16px;
  padding: 2rem;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
  color: #f2f2f2;
}
  .descanso-mensaje {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.descanso-mensaje {
  animation: aparecer 0.6s ease-out forwards;
}
  .logo-flotante {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 60px;
  opacity: 0.6;
  pointer-events: none;
}
  </style>
</head>

<body>
  <div class="contenedor">
    <img src="../../img/logo-movimiento.png" alt="Logo Movimiento Training" style="width: 120px; margin-bottom: 1rem;" />
  <h1>¡Hoy Es Tu Día De Descanso, Jacky!</h1>
  <p class="descanso-mensaje">
    🧘‍♂️ Tu cuerpo hoy se recupera, pero tu compromiso sigue firme.<br>
    Movete, hacé pausas activas, estirate, hidratate, y recordá que descansar también es avanzar.<br><br>
    ¡Nos vemos en el Próximo Entrenamiento con toda la energía!
</p>

</body>
</html>
