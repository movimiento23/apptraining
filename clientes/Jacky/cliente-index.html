<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Movimiento Training – Jacky</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      /* fondo de gimnasio */
      background: url('../../img/fondo-gimnasio2.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .progress-bar {
      height: 10px;
      background: #555;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .progress {
      height: 100%;
      width: 0%;
      background: #00c896;
      transition: width 0.3s ease;
    }
    #textoProgreso {
      text-align: center;
      margin-bottom: 1rem;
    }
    #meses {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-height: 220px;         /* 🔒 altura justa para 3 botones */
  overflow-y: auto;
  padding-right: 1rem;
}

/* Estilo del scroll para que se vea más fino */
#meses::-webkit-scrollbar {
  width: 6px;
}
#meses::-webkit-scrollbar-thumb {
  background-color: #aaa;
  border-radius: 5px;
}

    .btn-mes {
      background: #222;
      border: none;
      color: #fff;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .btn-mes:hover:not(.bloqueado):not(.completado) {
  background: #e3f2fd; /* azul cielo */
  color: #1e88e5;      /* azul fuerte */
  transform: scale(1.05);
}



.btn-mes.siguiente:hover,
.btn-mes.activo:hover {
  background: #FB8C00 !important;
  color: #000;
  transform: scale(1.05);
}

    .btn-mes.activo:hover {
  background: #FB8C00;   /* naranja más oscuro que #FFA726 */
  transform: scale(1.05);
}
    .btn-mes.activo {
      background: #1e88e5;
    }
    .btn-mes.siguiente {
      background: #FFA726;
      color: #000;
    }
    .btn-mes.bloqueado {
      background: #757575;
      color: #eee;
      cursor: not-allowed;
    }
    .btn-mes .icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
      .frase-motivacional {
  font-size: 1.2em;
  color: #ff6600;
  font-weight: bold;
  text-align: center;
  margin: 15px 0;
  font-family: 'Segoe UI', sans-serif;
}
  .btn-salir {
  background-color: #cc0000;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  margin: 20px auto;
  display: block;
  cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
}
.btn-salir:hover {
  background-color: #990000;
}
  .modal {
  position: fixed;
  z-index: 1000;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.75);
  justify-content: center;
  align-items: center;
  display: none;    /* ← oculto por defecto */
}
.modal-contenido {
  background: #111;
  color: #f2f2f2;
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  font-family: 'Segoe UI', 'Montserrat', sans-serif;
  max-width: 320px;
  margin: auto;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
  animation: fadeIn 0.3s ease-in-out;
}

.modal-botones {
  margin-top: 20px;
}

.modal-botones button {
  margin: 10px;
  padding: 10px 22px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
  transition: background-color 0.2s ease;
}

.modal-aceptar {
  background-color: #cc0000;
  color: white;
}
.modal-cancelar {
  background-color: #666;
  color: #f0f0f0;
}
.modal-aceptar:hover { background-color: #990000; }
.modal-cancelar:hover { background-color: #888; }

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
  .btn-mes:hover:not(.bloqueado):not(.completado) {
  background: #333;
  transform: scale(1.05);
}

.btn-mes.completado {
  background: #FFD700;
  color: #000;
}

.btn-mes.completado:hover {
  background: #FFC107;
  transform: scale(1.05);
}
#splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeOut 1s ease-in-out 3s forwards;
    }
    
    #splash.oculto {
        display: none;
    }
    
    .loader {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
    }
    .loader img {
        width: 170px;
        z-index: 2;
        filter: drop-shadow(0 0 10px #ff0000);
        animation: glow 2s ease-in-out infinite;
        margin-left: 10px;
    }
    .pulse-spinner {
        position: absolute;
        width: 200px;
        height: 200px;
        border: 8px solid #ff0000;
        border-radius: 50%;
        animation: pulse-spin 2s linear infinite;
        box-shadow: 0 0 20px #ff0000;
        z-index: 1;
    }
    .barra-gym {
        width: 200px;
        height: 20px;
        background: #222;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid #f7f3f3;
    }
    .peso {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #f7f3f3, #f7f3f3);
        animation: cargar-peso 3s ease-in-out infinite;
    }
    @keyframes pulse-spin {
        0% { transform: rotate(0deg) scale(1); opacity: 1; }
        50% { transform: rotate(180deg) scale(1.1); opacity: 0.7; }
        100% { transform: rotate(360deg) scale(1); opacity: 1; }
    }
    @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 10px #f7f3f3); }
        50% { filter: drop-shadow(0 0 20px #f7f3f3); }
    }
    @keyframes fadeOut {
        to { opacity: 0; visibility: hidden; }
    }
    @keyframes cargar-peso {
        0% { width: 0%; }
        50% { width: 100%; }
        100% { width: 0%; }
    }


  </style>
</head>
<body>
<div id="splash">
    <div class="loader">
        <img src="../../img/logo-movimiento.png" alt="Logo Movimiento Training">
        <div class="pulse-spinner"></div>
    </div>
    <div class="barra-gym">
        <div class="peso"></div>
    </div>
  </div>  
  <img src="../../img/logo-movimiento.png"
       alt="Logo Movimiento Training"
       style="width:120px; display:block; margin:0 auto 1rem;">
  <h1>Progreso mensual de Jacky</h1>
  <p class="frase-motivacional">🔥 “Preparate Para Ponerte En Movimiento.”</p>
  
  <div id="meses"></div>
  <div id="meses"></div>
  
  <button onclick="mostrarModal()" class="btn-salir">Cerrar sesión</button>

<div id="modal-salir" class="modal">
  <div class="modal-contenido">
    <p>¿Seguro que querés cerrar sesión?</p>
    <div class="modal-botones">
      <button onclick="cerrarSesion()" class="modal-aceptar">Sí, salir</button>
      <button onclick="cerrarModal()" class="modal-cancelar">Cancelar</button>
    </div>
  </div>
</div>

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    var totalMonths = 12;
    var contenedor  = document.getElementById("meses");
    contenedor.innerHTML = "";

    var estadoMes = {};
    var promesas  = [];

    // 1) HEAD para mes1 a mes12
    for (var i = 1; i <= totalMonths; i++) {
      (function(idx) {
        var url = "mes" + idx + "/index.html";
        var p = fetch(url, { method: "HEAD" })
          .then(function(res) { estadoMes[idx] = res.ok; })
          .catch(function()   { estadoMes[idx] = false; });
        promesas.push(p);
      })(i);
    }

    // 2) Esperamos todas las comprobaciones
    Promise.all(promesas).then(function() {
      for (var i = 1; i <= totalMonths; i++) {
        var estado = "";
        var icono  = "";
        var url    = "mes" + i + "/index.html";

        if (i === 1 && estadoMes[1]) {
  if (estadoMes[2]) {
    estado = "completado";
    icono  = '<i class="fas fa-trophy icon"></i>';
  } else {
    estado = "siguiente"; // activa color motivador y mancuerna
    icono  = '<i class="fas fa-dumbbell icon"></i>';
  }
}

        else if (i === 2 && estadoMes[1] && !estadoMes[2]) {
          // Mes 2: si no existe → bloqueado
          estado = "bloqueado";
          icono  = '<i class="fas fa-lock icon"></i>';
        }
        else if (estadoMes[i] && estadoMes[i + 1]) {
          // Completado si existe el siguiente
          estado = "completado";
          icono  = '<i class="fas fa-trophy icon"></i>';
        }
        else if (estadoMes[i]) {
          // Siguiente si existe pero no hay uno siguiente
          estado = "siguiente";
          icono  = '<i class="fas fa-dumbbell icon"></i>';
        }
        else {
          break; // mes inexistente → cortamos
        }

        var btn = document.createElement("button");
        btn.className = "btn-mes" + (estado ? " " + estado : "");
        btn.innerHTML = icono + " Mes " + i;

        if (estado !== "bloqueado") {
          (function(month) {
            btn.addEventListener("click", function() {
              window.location.href = "mes" + month + "/index.html";
            });
          })(i);
        }

        contenedor.appendChild(btn);
      }
    });
  });
  function mostrarModal() {
    document.getElementById("modal-salir").style.display = "flex";
  }

  function cerrarModal() {
    document.getElementById("modal-salir").style.display = "none";
  }

  function cerrarSesion() {
    localStorage.clear();
    window.location.replace("../../login.html");
  }
</script>

</body>
</html>
