<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias</title>
  <link rel="stylesheet" href="style.css"> <!-- Ajustá si tu CSS está en otra carpeta -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('img/fondo-gimnasio5.jpg') no-repeat center center fixed;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback-container {
      max-width: 500px;
      margin: 40px;
      padding: 30px;
      background-color: rgba(30, 30, 30, 0.9);
      color: #f0f0f0;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    .logo-thanks {
      width: 120px;
      margin-bottom: 20px;
    }

    .btn-primary {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 24px;
      background-color: #ff6b00;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #e65c00;
    }
  </style>
</head>
<body>
  <div class="feedback-container">
    <img src="img/logo-movimiento.png" alt="Logo Movimiento" class="logo-thanks">
    <h1>¡Gracias por tu confianza!</h1>
    <p>Tu formulario fue enviado con éxito. Pronto recibirás novedades sobre tu plan personalizado.</p>
    <p style="margin-top: 15px; font-style: italic;">Cada paso cuenta. Hoy diste el primero. ¡Vamos por más!</p>
    <a href="index.html" class="btn-primary">Volver al inicio</a>
  </div>
</body>
</html>
