  <style>
    body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: url('img/fondo-gimnasio5.jpg') no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}
    header {
      text-align: center;
      padding: 4rem 1rem 2rem;
    }

    header img {
      max-width: 160px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtitulo {
  color: white;
  font-weight: 500;
  font-size: 1.2rem; /* si querés que resalte un poco más */
  letter-spacing: 0.5px;
}

.subtitulo {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 1.2s ease-out forwards;
  font-size: 1.4rem;
  color: #f5f5f5;
  text-align: center;
  margin-top: 10px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); /* Sombra suave y profunda */
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


    .botones {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }

    .botones a {
      background-color: #e53935;
      color: #fff;
      padding: 0.75rem 1.8rem;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .botones a:hover {
      background-color: #d32f2f;
      transform: scale(1.05);
    }

    section.sobre {
      padding: 3rem 1.5rem;
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    section.sobre h2 {
      color: #e53935;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .descripcion {
  color: white;
  font-size: 1.1rem;
  font-weight: 500;
  line-height: 1.6;
  text-align: center;
  max-width: 700px;
  margin: 2rem auto;
}


    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #666;
    }
#splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeOut 1s ease-in-out 3s forwards;
    }
    
    #splash.oculto {
        display: none;
    }
    
    .loader {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
    }
    .loader img {
        width: 170px;
        z-index: 2;
        filter: drop-shadow(0 0 10px #ff0000);
        animation: glow 2s ease-in-out infinite;
        margin-left: 10px;
    }
    .pulse-spinner {
        position: absolute;
        width: 200px;
        height: 200px;
        border: 8px solid #ff0000;
        border-radius: 50%;
        animation: pulse-spin 2s linear infinite;
        box-shadow: 0 0 20px #ff0000;
        z-index: 1;
    }
    .barra-gym {
        width: 200px;
        height: 20px;
        background: #222;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid #f7f3f3;
    }
    .peso {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #f7f3f3, #f7f3f3);
        animation: cargar-peso 3s ease-in-out infinite;
    }
    @keyframes pulse-spin {
        0% { transform: rotate(0deg) scale(1); opacity: 1; }
        50% { transform: rotate(180deg) scale(1.1); opacity: 0.7; }
        100% { transform: rotate(360deg) scale(1); opacity: 1; }
    }
    @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 10px #f7f3f3); }
        50% { filter: drop-shadow(0 0 20px #f7f3f3); }
    }
    @keyframes fadeOut {
        to { opacity: 0; visibility: hidden; }
    }
    @keyframes cargar-peso {
        0% { width: 0%; }
        50% { width: 100%; }
        100% { width: 0%; }
    }

    /* ESTILOS ORIGINALES */
    header {
      text-align: center;
      padding: 4rem 1rem 2rem;
    }

    header img {
      max-width: 160px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtitulo {
  color: white;
  font-weight: 500;
  font-size: 1.2rem;
  letter-spacing: 0.5px;
}

.subtitulo {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 1.2s ease-out forwards;
  font-size: 1.4rem;
  color: #f5f5f5;
  text-align: center;
  margin-top: 10px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    .botones {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }

    .botones a {
      background-color: #e53935;
      color: #fff;
      padding: 0.75rem 1.8rem;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;

    }

    .botones a:hover {
      background-color: #d32f2f;
      transform: scale(1.05);
    }

      padding: 3rem 1.5rem;

    }

    section.sobre h2 {
      color: #e53935;
      margin-bottom: 1rem;

    }

    .descripcion {
  color: white;
  font-size: 1.1rem;
  font-weight: 500;
  line-height: 1.6;
  text-align: center;
  max-width: 700px;
  margin: 2rem auto;
}

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    /* OCULTAR CONTENIDO MIENTRAS SE MUESTRA EL SPLASH */
    #contenido-principal {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease-in-out;
    }
    
    #contenido-principal.mostrar {
        opacity: 1;
        visibility: visible;
    }  
#btn-instalar {
  background-color: #e53935;
  color: #fff;
  padding: 0.75rem 1.8rem;
  border: none;
  border-radius: 30px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Montserrat', sans-serif;
  cursor: pointer;
  transition: transform 0.2s, background-color 0.2s;
  margin: 2rem auto;
  display: none;
}
#btn-instalar:hover {
  background-color: #d32f2f;
  transform: scale(1.05);
}
body > .skiptranslate {
  display: none !important;
}

.goog-logo-link {
  display: none !important;
}    
    
/* Evitar superposición con elementos de Google */
.goog-te-banner-frame,
.goog-te-gadget, 
.goog-tooltip {
  display: none !important;
  z-index: -1 !important;
}

/* Mejorar z-index del botón instalar */
#btn-instalar {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
}

</head>
<body>
  <button id="btn-instalar" style="display: none;">📲 Descargar App</button>

<div id="splash">
    <div class="loader">
        <img src="img/logo-movimiento.png" alt="Logo Movimiento Training">
        <div class="pulse-spinner"></div>
    </div>
    <div class="barra-gym">
        <div class="peso"></div>
    </div>
  </div>  
  
  <div id="contenido-principal">
    <header>
      <img src="img/logo-movimiento.png" alt="Logo Movimiento" />
      <h1>Movimiento Training</h1>
      <p class="subtitulo">Entrenamiento personalizado. Progreso real. Transformación auténtica.</p>

      <div class="botones">
        <a href="login.html" class="btn-principal">Ingresar como Cliente</a>
        <a href="sobre.html">Sobre Movimiento</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </header>
    
    <div style="text-align: center; margin-top: 3rem;">
      <img src="img/logo-jlm-ihp.png" alt="Logo José Luis Mancilla IHP" style="width: 140px; max-width: 100%; opacity: 0.9;">
      <p style="color: white; font-size: 0.9rem; margin-top: 0.5rem;">José Luis Mancilla — Personal Trainer | IHP Certified</p>
    </div>

    <footer>
      © 2025 Movimiento Training — Todos los derechos reservados
    </footer>
  </div>

<script>
// Verificar si ya está logueado al entrar a la página principal
if (localStorage.getItem('usuarioLogueado')) {
  const carpeta = localStorage.getItem('usuarioLogueado');
  window.location.href = `clientes/${carpeta}/cliente-index.html`;
}

document.addEventListener('DOMContentLoaded', function() {
    // Verificar si ya se mostró el splash en esta sesión
    const splashMostrado = sessionStorage.getItem('splashMostradoIndex');
    
    if (!splashMostrado) {
        // Primera vez en la sesión - mostrar splash
        const splash = document.getElementById('splash');
        const contenido = document.getElementById('contenido-principal');
        
        // Marcar que ya se mostró el splash
        sessionStorage.setItem('splashMostradoIndex', 'true');
        
        // Ocultar el splash después de 4 segundos
        setTimeout(function() {
            splash.classList.add('oculto');
            contenido.classList.add('mostrar');
        }, 4000);
    } else {
        // Ya se mostró en esta sesión - ocultar splash y mostrar contenido
        document.getElementById('splash').classList.add('oculto');
        document.getElementById('contenido-principal').classList.add('mostrar');
    }
});

// Registrar Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js")
    .then(registration => {
      console.log("✅ Service Worker registrado:", registration);
    })
    .catch(err => {
      console.error("❌ Error al registrar SW:", err);
    });
}

// Verificar si el manifest se está cargando correctamente
window.addEventListener('load', function() {
  // Verificar manifest
  fetch('./manifest.json')
    .then(response => {
      if (response.ok) {
        console.log("✅ Manifest encontrado correctamente");
        return response.json();
      } else {
        console.error("❌ Error al cargar manifest:", response.status);
      }
    })
    .then(manifest => {
      console.log("📱 Datos del manifest:", manifest);
    })
    .catch(err => {
      console.error("❌ Error al parsear manifest:", err);
    });
});
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  console.log("🔥 beforeinstallprompt event fired");
  e.preventDefault();
  deferredPrompt = e;

  const installBtn = document.getElementById('btn-instalar');
  installBtn.style.display = 'block';

  installBtn.addEventListener('click', async () => {
    installBtn.style.display = 'none';
    
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const choiceResult = await deferredPrompt.userChoice;
      console.log('Resultado:', choiceResult.outcome);
      deferredPrompt = null;
    }
  });
});

// Agregar esto también:
window.addEventListener('appinstalled', (evt) => {
  console.log('🎉 App instalada');
  document.getElementById('btn-instalar').style.display = 'none';
});
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (const registration of registrations) {
        registration.unregister();
      }
      console.log('Todos los Service Workers desregistrados por la fuerza.');
    });
  }
</script>
</body>
